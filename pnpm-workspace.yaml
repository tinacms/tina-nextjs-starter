packages:                # keeps pnpm 9 (e.g. Vercel's default) treating this as a project
  - '.'
onlyBuiltDependencies:   # pnpm 10
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - workerd
allowBuilds:             # pnpm 11
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
# Works around the 1024 open-file limit on Cloudflare Workers Builds. Remove once @tinacms/cli sets maxParallelFileOps itself.
patchedDependencies:
  "@tinacms/cli": patches/@tinacms__cli.patch
